name: "Bug report / Segnalazione"
description: "Something does not work / Qualcosa non funziona"
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened? / Cosa è successo?"
      description: "Steps to reproduce, expected vs actual"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: "Browser and OS / Browser e sistema operativo"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "App version (footer) / Versione (piè di pagina)"
