name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint & vendored-code integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - name: vendor/qrcodegen.js matches vendor/qrcodegen.ts
        run: npm run vendor && git diff --exit-code vendor/
      - run: npm audit --audit-level=high

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - name: Unit tests with coverage gates
        run: npm run test:coverage

  e2e:
    # Job names are referenced by the branch ruleset's required checks: keep them stable.
    name: E2E tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [static, unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Chromium, browser: chromium, os: ubuntu-latest }
          - { name: Firefox, browser: firefox, os: ubuntu-latest }
          - { name: WebKit, browser: webkit, os: ubuntu-latest }
          # Closest automated stand-in for desktop Safari.
          - { name: WebKit on macOS, browser: webkit, os: macos-latest }
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e
      - name: Upload single-file build
        if: matrix.name == 'Chromium'
        uses: actions/upload-artifact@v7
        with:
          name: unibo-qr-html
          path: |
            dist/unibo-qr.html
            dist/unibo-qr.html.sha256
          if-no-files-found: error
          retention-days: 30
